<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1442">
<title>El hilo dorado: una aventura para mi princesa</title>
<style>
:root{--noche:#160f3a;--violeta:#3b2a80;--lavanda:#c9bcff;--oro:#f5c84f;--oro2:#ffe9a6;--perg:#f7edd3;--tinta:#2d2250}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Georgia,"Palatino Linotype",Palatino,"Times New Roman",serif;color:var(--perg);
background:linear-gradient(180deg,#120c33 0%,#26195f 55%,#4b2f8f 100%) fixed;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;
background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 8%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 55% 22%,#ffe9a6 50%,transparent 51%),radial-gradient(1px 1px at 78% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 22% 40%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 68% 46%,#ffe9a6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 8% 62%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 44% 70%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 85% 75%,#fff 50%,transparent 51%);
animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
#lanterns{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lantern{position:absolute;bottom:-70px;width:var(--s);height:calc(var(--s)*1.3);border-radius:42% 42% 48% 48%;
background:radial-gradient(circle at 50% 70%,#fff6cf,var(--oro) 55%,#d8932a);box-shadow:0 0 18px 6px rgba(245,200,79,.45);
opacity:0;animation:rise var(--d) linear var(--dl) infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.75}90%{opacity:.6}100%{transform:translate(var(--x),-118vh);opacity:0}}
#app{position:relative;max-width:560px;margin:0 auto;padding:18px 16px 8px}
#thread{list-style:none;display:flex;align-items:center;margin:6px 4px 18px;padding:0}
#thread[hidden]{display:none}
#thread li{flex:1;height:14px;position:relative}
#thread li:last-child{flex:0 0 14px}
#thread li::after{content:"";position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;border:2px solid var(--lavanda);background:transparent}
#thread li:not(:last-child)::before{content:"";position:absolute;left:14px;right:0;top:6px;height:2px;background:rgba(201,188,255,.35)}
#thread li.done::after{background:var(--oro);border-color:var(--oro);box-shadow:0 0 10px var(--oro)}
#thread li.done::before{background:var(--oro)}
#thread li.now::after{border-color:var(--oro);box-shadow:0 0 12px var(--oro);background:var(--noche)}
.card{background:linear-gradient(170deg,#faf1d9,#efe0b8);color:var(--tinta);border-radius:26px;padding:26px 22px 24px;
box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 0 2px rgba(200,150,40,.35),inset 0 0 40px rgba(190,140,50,.18);
outline:none;transition:opacity .35s ease,transform .35s ease;position:relative}
.card.out{opacity:0;transform:translateY(12px)}
.card.in{animation:appear .7s ease both}
@keyframes appear{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.card h1,.card h2{font-weight:normal;line-height:1.15;margin:0 0 14px;text-align:center;overflow-wrap:break-word}
.card h1{font-size:2.5rem;font-style:italic;color:#7a4c0c}
.card h2{font-size:1.65rem;color:#4a2f8f}
.sub{text-align:center;font-style:italic;color:#6a5a8c;margin:0 0 14px}
.card p{font-size:1.08rem;line-height:1.62;margin:0 0 14px;overflow-wrap:break-word}
.q{font-weight:bold}
.tower{display:block;width:min(70%,230px);margin:0 auto 6px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:54px;margin-top:10px;padding:12px 18px;border:0;border-radius:999px;font-size:1.12rem;
background:linear-gradient(180deg,#ffd96a,#e9a92c);color:#3a2306;box-shadow:0 6px 16px rgba(180,110,10,.35);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.soft{background:transparent;color:#4a2f8f;box-shadow:inset 0 0 0 2px rgba(74,47,143,.45);min-height:48px;font-size:1rem}
label{display:block;font-weight:bold;margin-bottom:6px}
input[type=text]{width:100%;min-height:54px;padding:10px 16px;font:inherit;font-size:18px;color:var(--tinta);background:#fffaf0;border:2px solid #b9a06a;border-radius:16px}
input[type=text]:focus{border-color:#6a4bd0;outline:3px solid rgba(106,75,208,.3)}
.msg{min-height:1.4em;margin:10px 0 0;font-size:1rem;color:#7a2a5a}
.hint{margin:8px 0 0;padding:10px 14px;border-radius:14px;background:rgba(106,75,208,.12);font-style:italic}
.ok{border-left:4px solid var(--oro);padding-left:14px;animation:appear .6s ease both}
.ok p:first-child{font-size:1.25rem;font-weight:bold;color:#7a4c0c}
.letter p{font-size:1.1rem}
.sign{text-align:right;font-style:italic;color:#7a4c0c}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.spark{position:fixed;width:8px;height:8px;border-radius:50%;background:var(--oro);box-shadow:0 0 10px 3px rgba(245,200,79,.8);pointer-events:none;z-index:5;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
footer{position:relative;text-align:center;padding:10px 16px 22px}
.link{background:none;border:0;color:var(--lavanda);text-decoration:underline;font-size:.9rem;min-height:44px;padding:0 12px}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (max-width:380px){.card{padding:22px 16px}.card h1{font-size:2.05rem}.card h2{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.lantern{opacity:.5}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div id="lanterns" aria-hidden="true"></div>
<main id="app">
  <ol id="thread" aria-label="Progreso de la aventura" hidden></ol>
  <section id="card" class="card" tabindex="-1" aria-live="polite"></section>
</main>
<footer><button id="reset" class="link" type="button">Reiniciar la aventura</button></footer>

<!-- ===== CONTENIDO Y LÓGICA (sin DOM). EDITA AQUÍ LOS TEXTOS ===== -->
<script id="logic">
var STORY = {
  title: "El hilo dorado",
  gameTitle: "El hilo dorado: una aventura para mi princesa",
  subtitle: "Había una vez una princesa que no sabía que aquella noche estaba a punto de entrar en su propio cuento…",
  prologue: {
    text: "Había una vez una niña que conocía el poder de los cuentos, de las estrellas y de los sueños imposibles.\n\nCon el tiempo, aquella niña creció, descubrió el mundo y vivió sus propias aventuras.\n\nPero hay algo maravilloso que nunca cambia: la capacidad de asombrarnos.\n\nEsta noche, alguien ha preparado una historia solo para ti.\n\nNo tienes que ser perfecta, valiente todo el tiempo ni saber qué va a pasar. Solo tienes que dejarte llevar, jugar y disfrutar.\n\nPorque esta vez, mi princesa, no vas a ver un cuento desde fuera.\n\nVas a vivirlo.\n\n¿Preparada para comenzar tu aventura?",
    button: "Entrar en el cuento"
  },
  chapters: [
    { title: "El oráculo de Grecia",
      text: "Todo gran cuento comienza con una pregunta.\n\nHace mucho tiempo, en la antigua Grecia, los viajeros acudían a lugares sagrados buscando respuestas. Y entre los dioses había uno relacionado con la luz, la música, la belleza y los oráculos.\n\nDicen que antes de descubrir los secretos del mundo, hay que atreverse a mirar con curiosidad.\n\nPrimera pregunta, princesa:",
      question: "¿Qué dios griego, asociado con la luz y los oráculos, podría iluminar el comienzo de nuestra aventura?",
      accept: /\bapol+o\b/,
      hint: "Su nombre comienza por A y también está relacionado con la música.",
      success: "¡La primera luz se ha encendido!\n\nToda aventura necesita una chispa de magia. Y la nuestra acaba de comenzar.",
      button: "Seguir el hilo dorado" },
    { title: "La princesa de esta historia",
      text: "En los cuentos, las princesas pueden tener coronas, vestidos preciosos o torres altísimas.\n\nPero una princesa no es especial por lo que lleva puesto. Lo es porque puede imaginar, reír, emocionarse y convertir un momento sencillo en una aventura.\n\nEsta noche no tienes que hacer nada extraordinario para merecer la magia.\n\nSolo disfrutarla.\n\nAhora dime, protagonista de esta historia:",
      question: "¿Quién es la princesa que va a vivir esta aventura?",
      accept: /\b(tu|yo|ella|princesa|protagonista|rapunzel)\b/,
      hint: "Piensa en quién está leyendo estas palabras ahora mismo.",
      success: "Exactamente. Esta historia está hecha para ti.\n\nY si algo quiero regalarte esta noche es la oportunidad de jugar, soñar y disfrutar como la protagonista de tu propio cuento.\n\nNo hace falta volver atrás para vivir algo mágico. A veces basta con permitirnos disfrutar del presente.",
      button: "Descubrir el siguiente capítulo" },
    { title: "Más allá de la torre",
      text: "Rapunzel miraba el mundo desde su torre y soñaba con descubrir qué había más allá.\n\nY, aunque nosotros no vivimos en una torre, también tenemos nuestras propias aventuras: momentos en los que el corazón se acelera, el mundo parece inmenso y nos atrevemos a probar algo diferente.\n\nPiensa en una de nuestras aventuras compartidas.\n\nHubo un día en el que dejamos el suelo muy por debajo, el viento nos acompañó y pudimos contemplar el mundo desde el cielo.",
      question: "¿Qué aventura fue aquella?",
      accept: /parapente/,
      hint: "Fue en el aire, con mucho viento y vistas increíbles. Empieza por «para».",
      success: "¡Correcto!\n\nA veces no necesitamos alas mágicas para sentir que estamos dentro de un cuento.\n\nBasta con atreverse a vivir algo nuevo… y tener a la persona adecuada al lado.",
      button: "Continuar volando" },
    { title: "El carruaje de nuestra aventura",
      text: "Toda princesa necesita una forma de continuar su viaje.\n\nEn algunos cuentos es un caballo blanco. En otros, una calabaza se convierte en carruaje.\n\nEn nuestra historia utilizamos algo bastante más moderno, pero también nos permite recorrer caminos y llegar a nuevos destinos.\n\nTu siguiente escenario te espera aparcado en casa.",
      question: "¿Qué medio de transporte te llevará al próximo capítulo?",
      accept: /\b(coche|auto|carro|automovil|vehiculo|turismo)\b/,
      hint: "Tiene cuatro ruedas y un maletero, y nos lleva a todas partes.",
      success: "¡El carruaje está esperando!\n\nEl siguiente capítulo se encuentra cerca. Sigue las pistas y no tengas prisa: lo bonito de un cuento es disfrutar también del camino.",
      button: "Ir al siguiente capítulo" },
    { title: "El cofre de las aventuras",
      text: "En los cuentos hay cofres encantados que guardan tesoros.\n\nPero los objetos más corrientes también pueden convertirse en parte de una aventura cuando están unidos a un recuerdo bonito.\n\nEn una de nuestras escapadas compramos algo que sirve para mantener las cosas fresquitas.\n\nHoy ese objeto tiene una misión muy especial: convertirse en el cofre de nuestra historia.",
      question: "¿Qué debes buscar?",
      accept: /\b(nevera|neverita|cooler|hielera|portatil)\b/,
      hint: "Lo compramos el día de nuestra aventura en el aire, y mantiene las cosas frías.",
      success: "¡Has encontrado el cofre de las aventuras!\n\nPuede que parezca un objeto normal, pero esta noche forma parte de algo preparado con muchísimo cariño.\n\nYa estás a un paso del desenlace.\n\nAcércate al coche, abre el maletero y busca la nevera portátil. Dentro te espera el último capítulo de esta aventura.",
      button: "Descubrir el último secreto" },
    { title: "La última luz",
      text: "Has seguido las luces, resuelto los enigmas y llegado hasta el cofre.\n\nPero en los cuentos más bonitos, el tesoro no es solo lo que encontramos al final. También son las risas, los nervios, las sorpresas y los recuerdos que construimos mientras avanzamos.\n\nAhora, princesa, ha llegado el momento de abrir tu cofre.\n\nBusca dentro de la nevera portátil que está en el maletero del coche.\n\nTu sorpresa te está esperando.",
      question: null,
      button: "Abrir el final del cuento" }
  ],
  epilogue: {
    title: "Las luces que elegimos compartir",
    text: "Mi princesa:\n\nCuando pienso en Rapunzel, pienso en esas luces que iluminaban el cielo y en la emoción de descubrir que el mundo podía ser todavía más bonito de lo que imaginábamos.\n\nQuería regalarte un poquito de esa magia.\n\nNo para devolverte nada, ni porque te falte algo, sino porque me encanta la idea de que podamos seguir sorprendiéndonos, jugando, riendo y viviendo aventuras juntos.\n\nMe gusta imaginarte disfrutando de esta historia, dejándote llevar y sintiéndote la protagonista de tu propio cuento.\n\nPorque crecer no significa dejar de soñar. Y para mí, uno de los regalos más bonitos es poder compartir la vida contigo y seguir creando recuerdos que algún día nos harán sonreír.\n\nEsta noche, las luces son para ti.\n\nY yo, si me dejas, quiero seguir a tu lado en muchos capítulos más.\n\nFeliz cumpleaños, mi princesa.\n\nTe quiero.",
    sign: "Con amor, tu compañero de aventuras. ❤️",
    button: "Volver a leer el cuento desde el principio"
  },
  msgs: {
    empty: "Escribe tu respuesta para comprobarla.",
    wrong: ["Casi, princesa. Inténtalo otra vez ✨", "Esa no es la respuesta, pero el hilo dorado sigue ahí. Prueba de nuevo.", "Todavía no. Puedes pedir una pista si quieres."],
    check: "Comprobar",
    hintBtn: "Pedir una pista"
  }
};

function norm(s) {
  return String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}
function checkAnswer(i, input) {
  var c = STORY.chapters[i];
  if (!c || !c.accept) return false;
  return c.accept.test(norm(input));
}
</script>

<!-- ===== INTERFAZ ===== -->
<script>
(function () {
  "use strict";
  var KEY = "hiloDoradoPaso";
  var TOTAL = STORY.chapters.length;           // 6
  var EPI = TOTAL + 1;                         // paso del epílogo
  var card = document.getElementById("card");
  var thread = document.getElementById("thread");
  var lanternBox = document.getElementById("lanterns");
  var step = 0, wrongCount = 0;

  function load() { try { var v = parseInt(localStorage.getItem(KEY), 10); return v >= 0 && v <= EPI ? v : 0; } catch (e) { return 0; } }
  function save() { try { localStorage.setItem(KEY, String(step)); } catch (e) {} }
  function clearSave() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function paras(parent, text, cls) {
    text.split("\n\n").forEach(function (t) { parent.appendChild(el("p", cls || "", t)); });
  }

  function lanterns(n) {
    lanternBox.textContent = "";
    for (var i = 0; i < n; i++) {
      var l = el("span", "lantern");
      var s = 10 + Math.random() * 16;
      l.style.left = (Math.random() * 96) + "%";
      l.style.setProperty("--s", s + "px");
      l.style.setProperty("--d", (14 + Math.random() * 14) + "s");
      l.style.setProperty("--dl", (-Math.random() * 24) + "s");
      l.style.setProperty("--x", ((Math.random() - 0.5) * 80) + "px");
      lanternBox.appendChild(l);
    }
  }

  function burst(target) {
    var r = target.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = Math.min(Math.max(r.top + 40, 80), window.innerHeight - 80);
    for (var i = 0; i < 18; i++) {
      var p = el("span", "spark");
      var a = (Math.PI * 2 * i) / 18, d = 60 + Math.random() * 70;
      p.style.left = cx + "px"; p.style.top = cy + "px";
      p.style.setProperty("--dx", Math.cos(a) * d + "px");
      p.style.setProperty("--dy", Math.sin(a) * d + "px");
      document.body.appendChild(p);
      (function (x) { setTimeout(function () { if (x.parentNode) x.parentNode.removeChild(x); }, 1000); })(p);
    }
  }

  function renderThread() {
    thread.textContent = "";
    if (step < 1) { thread.hidden = true; return; }
    thread.hidden = false;
    for (var i = 1; i <= TOTAL; i++) {
      var li = el("li");
      if (step > i) li.className = "done"; else if (step === i) { li.className = "now"; li.setAttribute("aria-current", "step"); }
      li.setAttribute("aria-label", "Capítulo " + i + (step > i ? " completado" : step === i ? " actual" : ""));
      thread.appendChild(li);
    }
  }

  function towerSvg() {
    var ns = "http://www.w3.org/2000/svg";
    var wrap = document.createElement("div");
    wrap.innerHTML = '<svg class="tower" viewBox="0 0 200 165" role="img" aria-label="Una torre de cuento bajo la luna" xmlns="' + ns + '">' +
      '<defs><radialGradient id="mg"><stop offset="0" stop-color="#fff8d6"/><stop offset="1" stop-color="#f5c84f"/></radialGradient></defs>' +
      '<circle cx="155" cy="38" r="26" fill="#f5c84f" opacity=".25"/><circle cx="155" cy="38" r="17" fill="url(#mg)"/>' +
      '<circle cx="30" cy="30" r="1.8" fill="#4a2f8f"/><circle cx="62" cy="18" r="1.4" fill="#4a2f8f"/><circle cx="110" cy="26" r="1.6" fill="#4a2f8f"/><circle cx="40" cy="70" r="1.3" fill="#4a2f8f"/>' +
      '<ellipse cx="100" cy="155" rx="80" ry="8" fill="#4a2f8f" opacity=".35"/>' +
      '<rect x="87" y="62" width="26" height="92" fill="#4a2f8f"/><polygon points="80,64 100,26 120,64" fill="#7a4c0c"/>' +
      '<rect x="95" y="80" width="10" height="16" rx="5" fill="#ffd96a"/>' +
      '<path d="M100 96 C 60 112, 140 128, 100 156" fill="none" stroke="#e9a92c" stroke-width="2.5" stroke-linecap="round"/></svg>';
    return wrap.firstChild;
  }

  function go(n) {
    card.classList.remove("in"); card.classList.add("out");
    setTimeout(function () {
      step = n; wrongCount = 0; save(); render();
      card.classList.remove("out"); card.classList.add("in");
      window.scrollTo(0, 0);
      try { card.focus({ preventScroll: true }); } catch (e) { card.focus(); }
    }, 350);
  }

  function btn(text, onClick, cls) {
    var b = el("button", "btn" + (cls ? " " + cls : ""), text);
    b.type = "button"; b.addEventListener("click", onClick); return b;
  }

  function renderPrologue() {
    card.appendChild(towerSvg());
    card.appendChild(el("h1", "", STORY.title));
    card.appendChild(el("p", "sub", STORY.subtitle));
    paras(card, STORY.prologue.text);
    card.appendChild(btn(STORY.prologue.button, function () { go(1); }));
  }

  function renderChapter() {
    var c = STORY.chapters[step - 1];
    card.appendChild(el("h2", "", "Capítulo " + step + ": " + c.title));
    paras(card, c.text);
    if (!c.question) {                       // capítulo final sin acertijo
      card.appendChild(btn(c.button, function () { go(EPI); }));
      return;
    }
    card.appendChild(el("p", "q", c.question));
    var form = el("form"); form.setAttribute("novalidate", "");
    form.setAttribute("autocomplete", "off");
    var id = "resp" + step;
    var lab = el("label", "", "Tu respuesta"); lab.setAttribute("for", id);
    var inp = el("input"); inp.type = "text"; inp.id = id; inp.name = id;
    inp.setAttribute("autocapitalize", "none"); inp.setAttribute("autocorrect", "off"); inp.setAttribute("spellcheck", "false");
    var msg = el("p", "msg"); msg.setAttribute("role", "status");
    var ok = el("button", "btn", STORY.msgs.check); ok.type = "submit";
    var hintBtn = btn(STORY.msgs.hintBtn, function () {
      if (hintBox.textContent) return;
      hintBox.textContent = "💡 " + c.hint; hintBtn.disabled = true;
    }, "soft");
    var hintBox = el("p", "hint"); hintBox.setAttribute("role", "status");
    form.appendChild(lab); form.appendChild(inp); form.appendChild(ok); form.appendChild(msg);
    card.appendChild(form); card.appendChild(hintBtn); card.appendChild(hintBox);
    hintBox.style.display = "none";
    hintBtn.addEventListener("click", function () { hintBox.style.display = ""; });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = inp.value;
      if (!norm(v)) { msg.textContent = STORY.msgs.empty; inp.focus(); return; }
      if (checkAnswer(step - 1, v)) {
        var box = el("div", "ok"); box.setAttribute("tabindex", "-1");
        paras(box, c.success);
        form.remove(); hintBtn.remove(); hintBox.remove();
        card.appendChild(box);
        box.appendChild(btn(c.button, function () { go(step + 1); }));
        burst(card);
        try { box.focus({ preventScroll: true }); } catch (err) {}
      } else {
        msg.textContent = STORY.msgs.wrong[wrongCount % STORY.msgs.wrong.length]; wrongCount++;
        inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
        inp.focus(); inp.select();
      }
    });
  }

  function renderEpilogue() {
    var E = STORY.epilogue;
    card.appendChild(el("h2", "", E.title));
    var letter = el("div", "letter"); paras(letter, E.text);
    card.appendChild(letter);
    card.appendChild(el("p", "sign", E.sign));
    card.appendChild(btn(E.button, restart, "soft"));
  }

  function render() {
    card.textContent = "";
    renderThread();
    lanterns(step === EPI ? 34 : 14);
    if (step === 0) renderPrologue();
    else if (step <= TOTAL) renderChapter();
    else renderEpilogue();
  }

  function restart() { clearSave(); go(0); }

  document.getElementById("reset").addEventListener("click", function () {
    if (window.confirm("¿Quieres volver al principio del cuento?")) restart();
  });

  step = load();
  render();
  card.classList.add("in");
})();
</script>
</body>
</html>
